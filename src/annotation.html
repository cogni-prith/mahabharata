<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Mahabharata | Annotation desk</title>
<style>
:root{color-scheme:light;--ink:#202c2b;--muted:#596a68;--line:#d8e1de;--accent:#176e61;--wash:#edf5f1;--paper:#fff;--danger:#a13e35}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#f5f7f6;color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button,input,select,textarea{border:1px solid #aabbb5;border-radius:4px;background:#fff;color:var(--ink)}input,select,textarea{padding:9px 10px;width:100%;min-width:0}textarea{resize:vertical;min-height:80px}input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}:focus-visible{outline:3px solid #daa345;outline-offset:3px}button{padding:8px 13px;min-height:38px}button:hover:not(:disabled){border-color:var(--accent);background:var(--wash)}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover:not(:disabled){background:#12594f;color:#fff}.icon{width:38px;min-width:38px;padding:0;font:22px system-ui}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:12px;font-weight:650;color:var(--accent);margin:0 0 6px}h1,h2,h3,p{margin-top:0}h1{font-size:24px;line-height:1.25;margin-bottom:6px}h2{font-size:16px;margin-bottom:12px}h3{font-size:14px}header{background:var(--paper);border-bottom:1px solid var(--line);padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:19px;font-weight:650}.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-left:12px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 71px)}aside{border-right:1px solid var(--line);background:#f0f4f2;padding:24px 20px;display:flex;flex-direction:column;gap:25px}.task-name{font-size:16px;font-weight:650;margin:4px 0 12px}.count{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}.count span{font-size:14px;font-weight:400;color:var(--muted)}progress{width:100%;height:6px;accent-color:var(--accent)}.side-label{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}.save-state{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}main{min-width:0;padding:28px 32px 40px}.page-head{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:24px}.nav{display:flex;align-items:center;gap:8px;white-space:nowrap;font-variant-numeric:tabular-nums}.work{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,1fr);gap:28px}.passage{background:#fff;border-top:3px solid var(--accent);padding:22px 24px;align-self:start;min-width:0}.citation{font-size:12px;color:var(--muted);margin-bottom:16px}.prose{font:20px/1.75 Georgia,"Times New Roman",serif;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.decision{min-width:0}.decisions{display:flex;border:1px solid #aabbb5;border-radius:4px;overflow:hidden;margin:0 0 18px}.decisions label{flex:1;padding:10px 8px;cursor:pointer;font-size:12px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff}.decisions label+label{border-left:1px solid var(--line)}.decisions label:has(input:checked){background:var(--wash);color:#105549;font-weight:650}.decisions input{width:14px;height:14px;accent-color:var(--accent)}.triple{border:1px solid var(--line);border-left:3px solid #8293bc;background:#fff;padding:14px;margin-bottom:12px;border-radius:4px}.triple-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.field-label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.predicate{margin:12px 0}.predicate-help{font-size:12px;color:var(--muted);margin:6px 0}.check{display:flex;gap:8px;align-items:start;font-size:12px}.check input{flex:0 0 auto;margin-top:2px}.notes{margin-top:22px}.bottom-bar{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:26px;padding-top:18px;gap:12px}.badge{display:inline-block;border:1px solid #b9cdc4;background:var(--wash);color:#275c49;border-radius:3px;padding:2px 7px;font-size:11px;white-space:nowrap}.badge.warn{color:#934638;border-color:#e5b8ae;background:#fceee9}.message{padding:10px 24px;min-height:42px;border-bottom:1px solid var(--line);color:var(--muted);background:#fff}.message.error{color:var(--danger);background:#fff0ee}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;color:var(--accent);font-size:13px}details p{font-size:13px;margin:10px 0}.candidate{border:1px solid var(--line);border-radius:4px;background:#fff;padding:20px;margin-bottom:18px;min-width:0}.candidate-header{display:flex;justify-content:space-between;gap:12px;align-items:start}.candidate h2{font-size:20px;margin:0 0 7px}.candidate-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(290px,1fr);gap:26px;margin-top:16px}.evidence{padding:12px 0;border-top:1px solid #e5e9e7}.evidence .prose{font-size:16px;line-height:1.7}.evidence .citation{margin-bottom:7px}.record-id{font:11px monospace;overflow-wrap:anywhere;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:6px;max-width:520px;width:calc(100% - 32px);padding:24px;color:var(--ink)}dialog::backdrop{background:#17292566}dialog .tools{justify-content:flex-end;margin-top:20px}.hidden,[hidden]{display:none!important}#progress-note{min-height:21px}.rules li{margin-bottom:8px}#entity-search-wrap{margin:0}#entity-picker{margin-top:7px}#final-state{font-size:12px;color:var(--muted)}
@media(min-width:1600px){main{padding:32px 48px}.work{gap:40px}.prose{font-size:21px}}
@media(max-width:1050px){.layout{grid-template-columns:200px minmax(0,1fr)}aside{padding:22px 16px}main{padding:24px 20px}.work,.candidate-body{grid-template-columns:1fr}.passage{padding:18px 20px}.brand small{display:none}}
@media(max-width:650px){header{padding:12px 16px;flex-wrap:wrap}.brand{font-size:18px}.tools{gap:6px}.layout{display:block}aside{padding:16px;border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.task-block{grid-column:1/-1}.task-name{margin-bottom:6px}.count{font-size:23px}.side-label{margin-top:0}.save-state{padding-top:0;border:0;font-size:11px;grid-column:1/-1}.aside-rules{display:none}main{padding:20px 16px 30px}.page-head{display:block;margin-bottom:16px}.nav{margin-top:14px;justify-content:space-between}h1{font-size:22px}.prose{font-size:18px;line-height:1.65}.work{gap:20px}.candidate{padding:14px}.pair{grid-template-columns:1fr}.bottom-bar{align-items:start}.message{padding:10px 16px}.decisions{flex-wrap:wrap}.decisions label{min-width:33%}.candidate-body{gap:12px}#next-unfinished{font-size:12px;padding:8px}.candidate h2{overflow-wrap:anywhere}.record-id{font-size:10px}}
</style>
</head>
<body>
<header><div class="brand">Mahabharata <small>Annotation desk</small></div><div class="tools"><button id="import">Import review</button><button id="export">Export draft</button><button id="submit" class="primary">Submit review</button><input type="file" id="file" accept=".json,application/json" hidden></div></header>
<div id="message" class="message" role="status" aria-live="polite">Ready.</div>
<div class="layout">
<aside>
 <div class="task-block"><p class="eyebrow">REVIEW WORKSPACE</p><div id="task-name" class="task-name"></div><div class="count" id="count"></div><progress id="progress" value="0" max="1" aria-label="Review completion"></progress><div class="small muted" id="progress-note">No decisions recorded</div></div>
 <div><label for="annotator" class="side-label">Annotator name</label><input id="annotator" autocomplete="name" placeholder="Your name"></div>
 <div id="entity-search-wrap" hidden><label for="entity-search" class="side-label">Find an appellation</label><input id="entity-search" type="search" placeholder="Name"><select id="entity-picker" aria-label="Appellation"></select></div>
 <div class="aside-rules"><p class="eyebrow">REVIEW STANDARD</p><p id="standard" class="small muted"></p><p class="small muted">A decision records your reading of the cited text.</p></div>
 <div class="save-state"><span class="dot"></span><span id="save-label">Draft recovery ready</span><p class="small muted" style="margin:6px 0 0">Export a file to keep a durable copy.</p><p id="final-state"></p></div>
</aside>
<main>
 <div class="page-head"><div><p class="eyebrow" id="phase"></p><h1 id="heading"></h1><p id="subheading" class="muted small"></p></div><div class="nav"><button id="prev" class="icon" title="Previous item" aria-label="Previous item">&larr;</button><span id="position"></span><button id="next" class="icon" title="Next item" aria-label="Next item">&rarr;</button></div></div>
 <div id="workspace"></div>
 <div class="bottom-bar"><span id="record-state" class="badge"></span><button id="next-unfinished">Next unfinished &rarr;</button></div>
 <details id="rules"><summary>Annotation rules and relation definitions</summary><div id="rule-content"></div></details>
</main>
</div>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-text"></p><label class="check" id="attest-wrap"><input type="checkbox" id="attest"><span id="attest-text"></span></label><div class="tools"><button id="cancel">Cancel</button><button id="confirm-action" class="primary">Confirm</button></div></dialog>
<script id="review-data" type="application/json">ANNOTATION_DATA</script>
<script>/* ANNOTATION_APP */</script>
</body>
</html>
